<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tafseer ul Quran al Kareem</title>
<meta name="description" content="Free Urdu translation and tafseer by Hafiz Abdul Salam bin Muhammad Bhutvi (Rahimahullah). No ads.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Tafseer ul Quran al Kareem">
<meta property="og:description" content="Free Urdu translation and tafseer by Hafiz Abdul Salam bin Muhammad Bhutvi (Rahimahullah). No ads.">
<meta property="og:image" content="https://naeem-shah.github.io/tafseeralquran/logo.png">
<style>
  :root {
    --bg: #fbf8f2; --text: #2a2620; --muted: #645c50; --accent: #5a6830;
    --card: #ffffff; --line: #e7e0d2; --tint: #efe6d6;
    --btn: #534741; --btn-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17150f; --text: #ece6da; --muted: #b3ab9e; --accent: #b5c27a;
            --card: #211e17; --line: #353026; --tint: #2b251c;
            --btn: #d8c4a8; --btn-text: #241f1a; }
    .brand .author { filter: invert(1) brightness(.92); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 56px; }
  .brand { text-align: center; padding: 28px 16px 22px; border-radius: 22px;
           background: linear-gradient(180deg, var(--tint), transparent); border: 1px solid var(--line); }
  .brand .logo { width: 120px; height: 120px; }
  .brand .author { display: block; height: 36px; margin: 14px auto 0; }
  .brand .rh { margin: 2px 0 0; color: var(--muted); font-family: "Noto Nastaliq Urdu", serif; }
  .brand h1 { margin: 8px 0 2px; font-size: 1.4rem; }
  .brand p.sub { margin: 0; color: var(--muted); }
  .stores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 8px; }
  .stores a { display: flex; align-items: center; justify-content: center; min-height: 50px;
              border-radius: 14px; background: var(--btn); color: var(--btn-text);
              font-weight: 600; text-decoration: none; }
  .links { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .links a { display: flex; justify-content: space-between; align-items: center; min-height: 56px;
             padding: 0 18px; color: var(--text); text-decoration: none; font-weight: 600;
             border-top: 1px solid var(--line); }
  .links a:first-child { border-top: 0; }
  .links a span { color: var(--muted); font-weight: 400; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  footer { margin-top: 32px; color: var(--muted); font-size: .9rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header class="brand">
    <img class="logo" src="logo.png" alt="Tafseer ul Quran al Kareem logo">
    <img class="author" src="author.png" alt="Hafiz Abdul Salam bin Muhammad">
    <p class="rh" dir="rtl">رحمہ اللہ تعالیٰ</p>
    <h1>Tafseer ul Quran al Kareem</h1>
    <p class="sub">Urdu translation and tafseer · Free · No ads</p>
  </header>

  <div class="stores">
    <a href="https://play.google.com/store/apps/details?id=com.naeem.tafseerulquran">Google Play</a>
    <a href="https://apps.apple.com/app/id1619084243">App Store</a>
  </div>

  <nav class="links">
    <a href="donate/">Support this work <span>›</span></a>
    <a href="privacy/">Privacy policy <span>›</span></a>
    <a href="https://wa.me/923084313504">Feedback on WhatsApp <span>↗</span></a>
  </nav>

  <footer>جزاکم اللہ خیرا</footer>
</main>
</body>
</html>
